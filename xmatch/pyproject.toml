[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xmatch"
version = "0.1.0"
description = "Billion-scale entity resolution and golden record synthesis with DuckDB and FalkorDB"
authors = [{ name = "Graph AI LLC" }]
dependencies = [
    "duckdb>=1.0.0",
    "falkordb>=1.7.0",
    "rapidfuzz>=3.0.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.4.0",
    "tabulate>=0.9.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0"
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0"
]
